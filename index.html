<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content keeps the bottom bar above the keyboard -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#14171a">
<title>New Note</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #14171a; --surface: #1d2125; --text: #e8eaed; --muted: #8b9198;
    --line: #2c3238; --green: #2f8f74; --blue: #3a6fb0;
    --tint: #2b3743; --tint-text: #cdd7e1;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f2ee; --surface: #fbfaf8; --text: #1d1f21; --muted: #6b7076; --line: #dcd8d2; --tint: #c3d1e0; --tint-text: #1c2b3a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    padding: 14px 18px 6px; color: var(--muted); font-size: 14px;
  }
  header .right { justify-self: end; }
  main {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    margin: 4px 14px 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  }
  textarea {
    flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: none;
    background: transparent; color: var(--text);
    font: 19px/1.45 system-ui, sans-serif; padding: 18px;
  }
  textarea::placeholder, input::placeholder { color: var(--muted); }
  .meta { border-top: 1px solid var(--line); }
  .meta input {
    display: block; width: 100%; border: 0; outline: none; background: transparent;
    color: var(--text); font-size: 16px; padding: 13px 18px;
  }
  .meta input + input { border-top: 1px solid var(--line); }
  #status {
    min-height: 22px; padding: 6px 20px 0; font-size: 13px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  footer {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 8px 14px calc(12px + env(safe-area-inset-bottom));
  }
  footer .row { display: flex; gap: 10px; width: 100%; }
  footer .row button {
    flex: 1; border: 0; border-radius: 14px; padding: 17px 8px;
    font-size: 17px; font-weight: 600; color: #fff;
  }
  #pinboard { background: var(--blue); }
  #pinkt { background: var(--green); }
  button:active { filter: brightness(.88); }
  button.small {
    border: 0; border-radius: 12px; padding: 10px 18px;
    background: var(--tint); color: var(--tint-text);
    font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <span>New note</span>
    <button id="inbox" class="small">View temp inbox</button>
    <span class="right"><button id="clear" class="small">Clear</button></span>
  </header>

  <main>
    <textarea id="note" placeholder="What's on your mind?" autofocus></textarea>
    <div class="meta">
      <input id="title" placeholder="Title (optional)" autocomplete="off">
      <input id="tags" placeholder="Tags" value="tempInbox" autocomplete="off" autocapitalize="none">
    </div>
  </main>

  <div id="status"></div>

  <footer>
    <div class="row">
      <button id="pinboard">Pinboard</button>
      <button id="pinkt">Pinkt</button>
    </div>
  </footer>

<script>
  const BASE = 'https://example.com/n/';
  const INBOX_TAG = 'tempInbox';
  const USER_KEY = 'pinboard-user';
  const DRAFT_KEY = 'new-note-draft';
  const p = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);
  const noteEl = $('note'), titleEl = $('title'), tagsEl = $('tags'), status = $('status');

  function makeUrl() {
    const d = new Date();
    return BASE + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
      '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  function fields() {
    return { note: noteEl.value.trim(), title: titleEl.value.trim(), tags: tagsEl.value.trim() };
  }
  function say(text) { status.textContent = text; }

  // Unsent draft survives the page closing.
  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ n: noteEl.value, t: titleEl.value, g: tagsEl.value })); } catch {}
  }
  function clearAll() {
    noteEl.value = ''; titleEl.value = ''; tagsEl.value = INBOX_TAG;
    try { localStorage.removeItem(DRAFT_KEY); } catch {}
  }
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (d) { noteEl.value = d.n || ''; titleEl.value = d.t || ''; tagsEl.value = d.g ?? INBOX_TAG; }
  } catch {}
  [noteEl, titleEl, tagsEl].forEach(el => el.addEventListener('input', saveDraft));
  noteEl.focus();

  // Pinboard: opens Pinboard's save form, filled in. Needs a connection and a pinboard.in login.
  $('pinboard').addEventListener('click', () => {
    const { note, title, tags } = fields();
    const tagList = tags.split(/\s+/).filter(Boolean)
      .filter((t, i, a) => a.findIndex(x => x.toLowerCase() === t.toLowerCase()) === i);
    const q = new URLSearchParams({
      url: makeUrl(),
      title: title || note.split('\n')[0].slice(0, 80) || 'Note',
      description: note,
      tags: tagList.join(' '),
      jump: 'close'
    });
    const w = window.open('https://pinboard.in/add?' + q.toString(), '_blank');
    say(w ? 'Opened Pinboard — tap Clear once it’s saved.' : 'Pop-up blocked — allow pop-ups for this site.');
  });

  // Pinkt: Android share menu. Works offline; Pinkt syncs later.
  $('pinkt').addEventListener('click', async () => {
    const { note, title } = fields();
    const url = makeUrl();
    if (!navigator.share) { say('Sharing not available here. URL: ' + url); return; }
    const data = { url };
    if (title) data.title = title;
    if (note) data.text = note;
    try {
      await navigator.share(data);
      clearAll();
      say('Sent to Pinkt.');
    } catch (e) {
      if (e.name !== 'AbortError') say('Share failed: ' + e.message);
    }
  });

  // Opens your Pinboard page for the inbox tag. Asks for your username once.
  $('inbox').addEventListener('click', () => {
    let user = '';
    try { user = localStorage.getItem(USER_KEY) || ''; } catch {}
    if (!user) {
      user = (prompt('Your Pinboard username (asked once):') || '').trim();
      if (!user) return;
      try { localStorage.setItem(USER_KEY, user); } catch {}
    }
    window.open('https://pinboard.in/u:' + encodeURIComponent(user) + '/t:' + INBOX_TAG + '/', '_blank');
  });

  $('clear').addEventListener('click', () => { clearAll(); say(''); noteEl.focus(); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
