<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>New Note</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box;
  }
  input {
    width: 100%; max-width: 420px; font-size: 18px; padding: 14px;
    border-radius: 12px; border: 1px solid #8888; box-sizing: border-box;
    background: transparent; color: inherit;
  }
  button {
    width: 100%; max-width: 420px; font-size: 22px; font-weight: 600;
    padding: 22px; border: 0; border-radius: 16px;
    background: #1f6f5c; color: #fff;
  }
  button:active { opacity: .8; }
  #url { font-family: ui-monospace, monospace; font-size: 13px; opacity: .6; word-break: break-all; text-align: center; }
  #msg { font-size: 14px; text-align: center; max-width: 420px; }
</style>
</head>
<body>
  <input id="title" placeholder="Title (optional)" autocomplete="off">
  <button id="go">New note → Pinkt</button>
  <div id="url"></div>
  <div id="msg"></div>
<script>
  const BASE = 'https://example.com/n/';
  const p = n => String(n).padStart(2, '0');
  function makeUrl() {
    const d = new Date();
    return BASE + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
      '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  const urlEl = document.getElementById('url');
  const msg = document.getElementById('msg');
  const titleEl = document.getElementById('title');

  document.getElementById('go').addEventListener('click', async () => {
    const url = makeUrl();
    urlEl.textContent = url;
    msg.textContent = '';
    const data = { url };
    const t = titleEl.value.trim();
    if (t) data.title = t;
    if (navigator.share) {
      try {
        await navigator.share(data);
        titleEl.value = '';
      } catch (e) {
        if (e.name !== 'AbortError') msg.textContent = 'Share failed: ' + e.message;
      }
    } else {
      try {
        await navigator.clipboard.writeText(url);
        msg.textContent = 'Sharing not available here. URL copied — paste it in Pinkt.';
      } catch {
        msg.textContent = 'Sharing not available here. Copy the URL above into Pinkt.';
      }
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
