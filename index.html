<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>New Note</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
    font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box;
  }
  .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
  .buttons { display: flex; gap: 10px; }
  button {
    flex: 1; font-size: 18px; font-weight: 600; padding: 16px 10px;
    border: 0; border-radius: 14px; color: #fff; background: #1f6f5c;
  }
  button.alt { background: #2d5f9a; }
  button.clear { flex: 0 0 auto; background: transparent; color: inherit; border: 1px solid #8888; font-weight: 400; }
  button:active { opacity: .8; }
  input, textarea {
    width: 100%; font-size: 18px; padding: 12px; border-radius: 12px;
    border: 1px solid #8888; box-sizing: border-box;
    background: transparent; color: inherit; font-family: inherit;
  }
  textarea { min-height: 35vh; resize: vertical; }
  #msg { font-size: 14px; min-height: 1em; }
  #url { font-family: ui-monospace, monospace; font-size: 12px; opacity: .55; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Buttons sit at the top so Android's clipboard pop-up (bottom of screen) can't cover them. -->
  <div class="buttons">
    <button id="pinboard" class="alt">Pinboard</button>
    <button id="pinkt">Pinkt</button>
    <button id="clear" class="clear" title="Clear">✕</button>
  </div>
  <div id="msg"></div>
  <textarea id="note" placeholder="Note…" autofocus></textarea>
  <input id="title" placeholder="Title (optional)" autocomplete="off">
  <input id="tags" placeholder="Tags, space separated (Pinboard button)" autocomplete="off" autocapitalize="none">
  <div id="url"></div>
</div>
<script>
  const BASE = 'https://example.com/n/';
  const DRAFT_KEY = 'new-note-draft';
  const p = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);
  const noteEl = $('note'), titleEl = $('title'), tagsEl = $('tags'), msg = $('msg'), urlEl = $('url');

  function makeUrl() {
    const d = new Date();
    return BASE + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
      '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  function fields() {
    return { note: noteEl.value.trim(), title: titleEl.value.trim(), tags: tagsEl.value.trim() };
  }

  // Unsent draft survives the page closing.
  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ n: noteEl.value, t: titleEl.value, g: tagsEl.value })); } catch {}
  }
  function clearAll() {
    noteEl.value = ''; titleEl.value = ''; tagsEl.value = ''; urlEl.textContent = '';
    try { localStorage.removeItem(DRAFT_KEY); } catch {}
  }
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (d) { noteEl.value = d.n || ''; titleEl.value = d.t || ''; tagsEl.value = d.g || ''; }
  } catch {}
  [noteEl, titleEl, tagsEl].forEach(el => el.addEventListener('input', saveDraft));
  noteEl.focus();

  // Pinboard: opens Pinboard's own save form with everything filled in.
  // Needs a connection and being logged in to pinboard.in in your browser.
  $('pinboard').addEventListener('click', () => {
    const { note, title, tags } = fields();
    const url = makeUrl();
    urlEl.textContent = url;
    const q = new URLSearchParams({
      url,
      title: title || note.split('\n')[0].slice(0, 80) || 'Note',
      description: note,
      tags,
      jump: 'close'
    });
    const w = window.open('https://pinboard.in/add?' + q.toString(), '_blank');
    msg.textContent = w ? 'Opened Pinboard. Check it saved, then tap ✕ to clear.'
                        : 'Pop-up blocked. Allow pop-ups for this site and try again.';
  });

  // Pinkt: Android share menu. Works offline; Pinkt syncs later.
  $('pinkt').addEventListener('click', async () => {
    const { note, title } = fields();
    const url = makeUrl();
    urlEl.textContent = url;
    msg.textContent = '';
    if (!navigator.share) {
      try { await navigator.clipboard.writeText(url); msg.textContent = 'Sharing not available. URL copied for Pinkt.'; }
      catch { msg.textContent = 'Sharing not available. Copy the URL below into Pinkt.'; }
      return;
    }
    const data = { url };
    if (title) data.title = title;
    if (note) data.text = note;
    const sharing = navigator.share(data);
    if (note) navigator.clipboard?.writeText(note).catch(() => {});
    try {
      await sharing;
      clearAll();
      msg.textContent = note ? 'Sent. Note is also on your clipboard if Pinkt left it out.' : 'Sent.';
    } catch (e) {
      if (e.name !== 'AbortError') msg.textContent = 'Share failed: ' + e.message;
    }
  });

  $('clear').addEventListener('click', () => { clearAll(); msg.textContent = ''; noteEl.focus(); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
